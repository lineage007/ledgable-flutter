name: ledgable_app
description: "Ledgable — Australian AI-native accounting for small business. Mobile companion to the Ledgable web app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+4

environment:
  sdk: ^3.11.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # Injectable "now", so relative dates and the FY label are testable.
  clock: ^1.1.2
  fl_chart: ^1.2.0
  intl: ^0.20.2
  shared_preferences: ^2.5.4

  # State + routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Networking
  dio: ^5.9.0

  # Credentials live in the Keychain / Android Keystore, never in prefs.
  flutter_secure_storage: ^9.2.4

  # Money is never a double — see docs/mobile/openapi.yaml "Money".
  decimal: ^3.2.6

  # Device identity + descriptor for POST /auth/login.
  uuid: ^4.5.2
  package_info_plus: ^8.3.1
  device_info_plus: ^12.4.0

  # Receipt capture.
  image_picker: ^1.2.1

  # Opening the web app for the things the mobile API cannot do — approving a
  # pay run, editing an extraction, downloading a data export.
  url_launcher: ^6.3.1

  # MediaType for the receipt upload part. A transitive dependency of dio, but
  # declared because this package imports it directly.
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# flutter_launcher_icons configuration
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app-icon-1024.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: true
    image_path: "assets/icons/app-icon-1024.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # No `assets:` block. The only thing under assets/ besides the fonts is the
  # 1024px master icon, which flutter_launcher_icons reads from disk when it
  # generates the platform icon sets — the app never loads it at runtime, so
  # bundling it would ship bytes nothing reads.

  # Inter and Plus Jakarta Sans are bundled rather than fetched at runtime.
  #
  # google_fonts downloads them on first launch and caches them, which means a
  # new install shows a fallback face until the download lands — and shows it for
  # as long as the handset has no signal. Somebody opening this app in a basement
  # should not get different typography, and an accounting figure rendered in an
  # unexpected face reads as a fault. Bundling costs about 2.2 MB in the binary
  # and removes the launch-time network dependency entirely.
  #
  # Both families are SIL Open Font License 1.1; the licences ship beside them in
  # assets/fonts, which is what the OFL requires.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
