name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Goldens compare pixels and are rendered on macOS; Linux rasterises text
      # differently, so they are excluded here (see dart_test.yaml) and run
      # locally with `flutter test --tags golden`.
      # Sydney time, so date logic runs in a zone with daylight saving, as it
      # does for most of the app's users.
      - name: Test
        run: flutter test --exclude-tags golden
        env:
          TZ: Australia/Sydney
